<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyStash</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #020617;
      }

      #app {
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <style>
        .app-boot-fallback {
          min-height: 100dvh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #020617;
          color: #e2e8f0;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
        }

        .app-boot-fallback__card {
          display: grid;
          justify-items: center;
          gap: 14px;
          width: min(100%, 320px);
          text-align: center;
        }

        .app-boot-fallback__spinner {
          width: 34px;
          height: 34px;
          border: 3px solid rgba(148, 163, 184, 0.24);
          border-top-color: #2dd4bf;
          border-radius: 999px;
          animation: app-boot-spin 0.85s linear infinite;
        }

        .app-boot-fallback__title {
          margin: 0;
          font-size: 18px;
          font-weight: 800;
        }

        .app-boot-fallback__text {
          margin: 0;
          color: #94a3b8;
          font-size: 14px;
          line-height: 1.5;
        }

        @keyframes app-boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="app-boot-fallback" role="status" aria-live="polite">
        <div class="app-boot-fallback__card">
          <div class="app-boot-fallback__spinner" aria-hidden="true"></div>
          <p class="app-boot-fallback__title">Chargement de MyStash</p>
          <p class="app-boot-fallback__text">Preparation de ton espace...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
