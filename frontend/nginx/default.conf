server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    default_type application/octet-stream;

    # A HTML response must never be substituted for a module. It causes the
    # browser MIME error seen in production and leaves a blank application.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite's entry document is intentionally revalidated so it always points
    # at the current hashed assets after a deployment.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # These are development-only endpoints. A production deployment must not
    # proxy them to a local live-reload server.
    location = /reload.js { return 404; }
    location = /ws { return 404; }

    # SPA history fallback is restricted to navigation requests. Static files
    # are always served directly or fail with 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
