services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: snkProjet_docker
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sh:/docker-entrypoint-initdb.d/001-stash-init.sh:ro
      - ./backend/src/main/resources/db/migration:/opt/stash-migrations:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        MAVEN_ARGS: "-B -DskipTests"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/snkProjet_docker
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # A fresh Docker database is initialized from V1, then Flyway applies V2+.
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
      APP_STORAGE_ROOT: /app/uploads
      # SMTP (Brevo)
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
      # App
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_FRONTEND_RESET_PASSWORD_URL: ${APP_FRONTEND_RESET_PASSWORD_URL:-http://localhost:5173/reset-password}
      APP_FRONTEND_VERIFY_EMAIL_URL: ${APP_FRONTEND_VERIFY_EMAIL_URL:-http://localhost:5173/verify-email}
      APP_PASSWORD_RESET_EXP_MINUTES: ${APP_PASSWORD_RESET_EXP_MINUTES:-60}
      APP_BACKEND_PUBLIC_BASE_URL: ${APP_BACKEND_PUBLIC_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:5173}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_DELIVERY_MAIL_SCAN_ENABLED: ${APP_DELIVERY_MAIL_SCAN_ENABLED:-false}
      APP_DELIVERY_TRACKING_REFRESH_ENABLED: ${APP_DELIVERY_TRACKING_REFRESH_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: >
      sh -c "if [ ! -x node_modules/.bin/vite ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then
        npm ci --no-audit --no-fund;
      fi;
      npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  db-data:
    # Stable name: keeps the historical local database even if the project folder is renamed.
    name: ${POSTGRES_VOLUME_NAME:-pg17-data}
  uploads-data:
  frontend-node-modules:
