services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set production database URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Set production database user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set production database password}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT secret}
      APP_FRONTEND_BASE_URL: https://mystash.fr
      APP_BACKEND_PUBLIC_BASE_URL: https://api.mystash.fr
      APP_CORS_ALLOWED_ORIGINS: https://mystash.fr,https://www.mystash.fr
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://api.mystash.fr
        VITE_GOOGLE_OAUTH_URL: https://api.mystash.fr/oauth2/authorization/google
        VITE_DISCORD_OAUTH_URL: https://api.mystash.fr/oauth2/authorization/discord
    ports:
      - "8081:8080"
